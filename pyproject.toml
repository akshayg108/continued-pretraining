[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-cp"
version = "0.1.0"
description = "Continued pretraining and downstream evaluation for visual encoders"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Akshay Ghandikota"},
    {name= "Jakob Ambsdorf", email="jaam@di.ku.dk"},
    {name= "Haodong Zhang", email="haodong_zhang@brown.edu"}
]
keywords = ["deep learning", "self-supervised learning", "continued pretraining", "vision transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.15.0",
    "lightning>=2.4.0",
    "timm>=1.0.20",
    "wandb>=0.15.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.7.0",
    "pyarrow>=20.0.0",
    "torchmetrics>=1.0.0",
    "numpy>=1.20.0",
    "tqdm>=4.60.0",
    "pillow>=9.0.0",
    "stable-pretraining @ git+https://github.com/galilai-group/stable-pretraining.git@9aa93f8b6153eebb73f57d4853ccf8a13d848310",
    "stable-datasets @ git+https://github.com/haodongzhang0118/stable-datasets",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
]

[tool.setuptools]
packages = {find = {where = ["."], include = ["stable_cp*"]}}

[tool.black]
line-length = 100
target-version = ['py310']
